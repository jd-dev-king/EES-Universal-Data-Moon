name: Deploy project page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages production app
        env:
          GITHUB_ACTIONS: "true"
          VITE_API_BASE_URL: https://ees-universal-data-moon-api-production.up.railway.app
        run: npm run build

      - name: Verify production API target
        run: |
          if ! grep -R -q "https://ees-universal-data-moon-api-production.up.railway.app" dist/assets; then
            echo "ERROR: Railway production API URL is missing from production bundle"
            exit 1
          fi

          echo "PASS: Railway production API target found"

      - name: Verify GitHub Pages asset paths
        run: |
          if ! grep -q "/EES-Universal-Data-Moon/assets/" dist/index.html; then
            echo "ERROR: GitHub Pages base path is missing"
            exit 1
          fi

          echo "PASS: GitHub Pages asset base path verified"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4