name: Deploy Data Moon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Universal Data Moon
        env:
          # Production must target Railway. Do not allow the static GitHub
          # Pages build to inherit the localhost development fallback.
          VITE_API_BASE_URL: https://ees-universal-data-moon-api-production.up.railway.app
        run: npm run build

      - name: Verify production API target
        run: |
          if grep -R "http://localhost:8000" dist/assets; then
            echo "ERROR: production bundle contains localhost API target"
            exit 1
          fi
          grep -R "ees-universal-data-moon-api-production.up.railway.app" dist/assets >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4